# Answers @claude mentions in issues, PR comments and PR reviews.
#
# Call it from the repository, in .github/workflows/claude.yml:
#
#   name: Claude Code
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#     pull_request_review:
#       types: [submitted]
#     issues:
#       types: [opened, assigned]
#   jobs:
#     claude:
#       permissions:
#         contents: read
#         pull-requests: read
#         issues: read
#         id-token: write
#         actions: read
#       uses: Cell-Ed/workflows/.github/workflows/claude_code_mention.yml@main
#       secrets: inherit
#
# A called workflow cannot hold more permissions than its caller grants, so the
# caller's permissions block is required.

name: (claude) Answer @claude mentions

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
