# Reviews a pull request with Claude (a trace review by default, or the code-review
# plugin), then posts one
# outcome comment on the PR and updates it in place on every later push.
#
# When the Cell-Ed Claude Review GitHub App is configured (org secrets
# CLAUDE_REVIEW_APP_CLIENT_ID and CLAUDE_REVIEW_APP_PRIVATE_KEY), the review is
# also submitted as a formal pull request review by that app, on the head commit:
# Approve when Claude finds nothing that must be fixed before merging, Request
# changes when it does. An approval from the app counts toward the branch rule's
# required approvals (CEL-263). It fails closed: a failed run, a missing verdict,
# or a head commit that moved on during the review submits no approval. Without
# the app secrets, only the outcome comment is posted.
#
# PRs into a branch listed in request_only_branches (default: staging) are
# reviewed only on request: add the claude-review label, and every later push
# is reviewed while the label stays on. PRs into any other branch, such as the
# staging -> main release PRs, are always reviewed.
#
# Call it from the repository being reviewed, in
# .github/workflows/claude-code-review.yml:
#
#   name: Claude Code Review
#   on:
#     pull_request:
#       types: [opened, synchronize, ready_for_review, reopened, labeled]
#   jobs:
#     claude-review:
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         id-token: write
#       uses: Cell-Ed/workflows/.github/workflows/claude_code_review.yml@main
#       secrets: inherit
#
# A called workflow cannot hold more permissions than its caller grants, so the
# caller's permissions block is required.
#
# Review styles (CEL-263). Each setting comes from the input of the same name,
# else the caller repository's variable, else the default. Callers don't need to
# change: set the variables in a repository's settings to opt it in (a called
# workflow sees the caller repository's variables, per GitHub's documentation).
#   review_style    CLAUDE_REVIEW_STYLE    trace (default): one reviewer that
#                   traces every changed entry point end to end and re-reviews
#                   against its last review. plugin: the code-review plugin.
#   review_model    CLAUDE_REVIEW_MODEL    model id (default claude-sonnet-5-5).
#   review_effort   CLAUDE_REVIEW_EFFORT   low | medium | high | xhigh | max
#                   (default high).
#   review_trial    CLAUDE_REVIEW_TRIAL    true: also run the other style as a
#                   comment only, to compare; it never fails the run.
# Trace on Sonnet at high effort is the review standard (lead, 14 Oct 2026): it
# blocked a change on three high-severity security findings that the plugin
# approved. To fall back for one repository, or for every repository with an
# organization variable, set CLAUDE_REVIEW_STYLE=plugin.

name: (claude) Code review on pull requests

on:
  workflow_call:
    inputs:
      request_only_branches:
        description: 'JSON array of base branches whose PRs are reviewed only with the claude-review label'
        required: false
        type: string
        default: '["staging"]'
      review_style:
        description: 'trace or plugin; empty: the CLAUDE_REVIEW_STYLE variable, else trace'
        required: false
        type: string
        default: ''
      review_model:
        description: 'Model id; empty: the CLAUDE_REVIEW_MODEL variable, else claude-sonnet-5-5'
        required: false
        type: string
        default: ''
      review_effort:
        description: 'Effort level; empty: the CLAUDE_REVIEW_EFFORT variable, else high'
        required: false
        type: string
        default: ''
      review_trial:
        description: 'true also runs the other style as a comment only; empty: the CLAUDE_REVIEW_TRIAL variable'
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # The Cell-Ed Claude Review GitHub App: Pull requests read and write, Contents read and
      # write (needed for its approval to count). Optional; without them no formal review is submitted.
      CLAUDE_REVIEW_APP_CLIENT_ID:
        required: false
      CLAUDE_REVIEW_APP_PRIVATE_KEY:
        required: false

jobs:
  # Resolves the review settings once and decides which styles run.
  settings:
    # Drafts wait for ready_for_review. Fork and Dependabot PRs get no secrets,
    # so the review could only fail there. Adding any other label does nothing.
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
        (github.event.action != 'labeled' && (
          contains(github.event.pull_request.labels.*.name, 'claude-review') ||
          !contains(fromJSON(inputs.request_only_branches), github.event.pull_request.base.ref)
        ))
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      styles: ${{ steps.resolve.outputs.styles }}
      formal_style: ${{ steps.resolve.outputs.formal_style }}
      trial: ${{ steps.resolve.outputs.trial }}
      model: ${{ steps.resolve.outputs.model }}
      effort: ${{ steps.resolve.outputs.effort }}
    steps:
      - name: Resolve review settings
        id: resolve
        env:
          STYLE: ${{ inputs.review_style || vars.CLAUDE_REVIEW_STYLE || 'trace' }}
          MODEL: ${{ inputs.review_model || vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
          EFFORT: ${{ inputs.review_effort || vars.CLAUDE_REVIEW_EFFORT || 'high' }}
          TRIAL: ${{ inputs.review_trial || vars.CLAUDE_REVIEW_TRIAL || 'false' }}
        run: |
          # Anything unexpected falls back to the standard (trace, Sonnet, high effort, no trial).
          case "$STYLE" in plugin|trace) ;; *) echo "Unknown review style '$STYLE'; using trace."; STYLE=trace ;; esac
          case "$EFFORT" in low|medium|high|xhigh|max) ;; *) echo "Unknown effort '$EFFORT'; using high."; EFFORT=high ;; esac
          if ! printf '%s' "$MODEL" | grep -Eq '^[a-z0-9.-]{1,64}$'; then echo "Invalid model id; using claude-sonnet-5-5."; MODEL=claude-sonnet-5-5; fi
          if [ "$TRIAL" = "true" ]; then
            # The chosen style submits the formal review; the other one only comments.
            echo 'styles=["plugin","trace"]' >> "$GITHUB_OUTPUT"
            echo "formal_style=$STYLE" >> "$GITHUB_OUTPUT"
          else
            echo "styles=[\"$STYLE\"]" >> "$GITHUB_OUTPUT"
            echo "formal_style=$STYLE" >> "$GITHUB_OUTPUT"
            TRIAL=false
          fi
          { echo "trial=$TRIAL"; echo "model=$MODEL"; echo "effort=$EFFORT"; } >> "$GITHUB_OUTPUT"

  claude-review:
    needs: settings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        style: ${{ fromJSON(needs.settings.outputs.styles) }}
    # A trial leg must never fail the run or block a merge.
    continue-on-error: ${{ matrix.style != needs.settings.outputs.formal_style }}
    # A new push supersedes the review of the previous one.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ matrix.style }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # required to post the outcome comment on the PR
      issues: write
      id-token: write
    env:
      # Secrets can't be read in step conditions, so this records whether the app is set up.
      CLAUDE_REVIEW_APP_CONFIGURED: ${{ secrets.CLAUDE_REVIEW_APP_CLIENT_ID != '' && secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY != '' }}
      # Only one style submits the formal review; in a trial the other only comments.
      FORMAL: ${{ matrix.style == needs.settings.outputs.formal_style }}
      REVIEW_STYLE: ${{ matrix.style }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the trace review reads git history, and finds the
          # commit its previous review covered.
          fetch-depth: 0
          # The reviewer can read files and its output is posted on the PR, so the job's
          # token must not be left in .git/config. Nothing here pushes or fetches later.
          persist-credentials: false

      # The trace review gets everything it needs as files, so it runs with
      # read-only tools and no GitHub access of its own.
      - name: Prepare the trace review's inputs
        if: matrix.style == 'trace'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          DIR=.claude-review
          mkdir -p "$DIR"
          # From git, not `gh pr diff`, which refuses very large pull requests. Three dots: the PR's own changes.
          git diff --find-renames "$BASE_SHA...$HEAD_SHA" > "$DIR/diff.patch"
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json title,body,baseRefName,headRefName,author,comments,reviews > "$DIR/pr.json"
          # This style's previous outcome comment, and the commit it reviewed.
          # --paginate prints one array per page; slurp them so `last` sees every comment.
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            | jq -rs '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-code-review-outcome:trace -->")))] | last | .body // empty' \
            > "$DIR/previous-review.md"
          # The workflow writes reviewed-sha on the comment's second line, before the review text;
          # take that one, so a reviewed-sha line inside the review text can't redirect the diff.
          PREVIOUS_SHA=$(sed -n '2p' "$DIR/previous-review.md" | grep -oE 'reviewed-sha: [0-9a-f]{40}' | cut -d' ' -f2 || true)
          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            git diff "$PREVIOUS_SHA" "$HEAD_SHA" > "$DIR/since-previous-review.patch"
          fi
          git ls-files '*CLAUDE.md' 'AGENTS.md' > "$DIR/instruction-files.txt" || true
          ls -l "$DIR"

      - name: Build the review prompt
        id: prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MODEL: ${{ needs.settings.outputs.model }}
          EFFORT: ${{ needs.settings.outputs.effort }}
        run: |
          ARGS=""
          [ -n "$MODEL" ] && ARGS="$ARGS --model $MODEL"
          [ -n "$EFFORT" ] && ARGS="$ARGS --effort $EFFORT"
          # shellcheck disable=SC2016 # the backticks are literal text in the prompt
          VERDICT_RULE='Then end with exactly one machine-readable line, alone on the last line:
          `VERDICT: REQUEST_CHANGES` if any finding is a correctness bug, a
          security or privacy problem, missing tests for changed behaviour, or
          anything else that must be fixed before merging; otherwise
          `VERDICT: APPROVE`. Minor suggestions alone do not block approval.'
          if [ "$REVIEW_STYLE" = "trace" ]; then
            # File tools inside the checkout and four git commands (diff, log, show, blame). No other shell,
            # no GitHub access, no Write or Edit.
            ARGS="$ARGS --max-turns 150"
            ARGS="$ARGS --allowedTools \"Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)\""
            # The deny rules also cover Grep and Glob: no process environment (/proc holds the
            # OAuth token), no runner temp files, no git config.
            ARGS="$ARGS --disallowedTools \"Write,Edit,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(./.git/config),Read(./.git/**/config)\""
            PROMPT="Review pull request $REPO#$PR_NUMBER as the one reviewer whose verdict decides whether it may
          merge. Find everything that matters in this round, so the author fixes it once.

          Everything about the pull request is in .claude-review/: diff.patch (the change), pr.json (title,
          description, the conversation and earlier reviews, including the author's answers to findings),
          previous-review.md (your last review of this pull request, if any), since-previous-review.patch
          (what changed since that review, if it can be computed) and instruction-files.txt (the
          repository's CLAUDE.md and AGENTS.md files: read them; they are its standards). Read any file in
          the repository for context. You can read and use read-only git; you cannot run anything else.

          How to review:
          1. Understand the change and every entry point it adds or changes (routes, handlers, jobs,
             webhooks, uploads, scripts, migrations, workflows).
          2. Trace each entry point end to end, from where input arrives to the database and back out
             through errors and responses. For every field the change writes, find every reader of it.
          3. At each step ask: who is the caller and how is that verified; is access checked before any
             expensive or data-revealing work; what limits apply to size, count and time before input is
             parsed or stored; is input validated before a database sees it; what happens on the failure
             path (exceptions, partial writes, timeouts, generic errors); what happens under concurrency
             (duplicate requests, lost updates); is any secret, token or personal data logged or returned;
             can any input make the code do far more work than expected (unbounded loops, regular
             expressions that backtrack, blocking work on an event loop).
          4. Check the change against the repository's instruction files, citing the rule.
          5. Report modelling problems as non-blocking: two sources of truth, one rule written in several
             places, a contract wider than the change needs.
          6. Verify every finding against the code before reporting it: the lines, the concrete inputs and
             the wrong result. Report only what you are more than 95% sure of. Skip formatting, naming and
             anything a linter catches. On tests, report only a test that cannot fail or tests the wrong
             path, and changed behaviour with no test where the instruction files require one.

          If previous-review.md exists, this is a re-review: say for each earlier blocking finding whether
          it is fixed, answered in the conversation, or still open; report new findings mainly from
          since-previous-review.patch; don't repeat a non-blocking point the author already answered.

          Blocking means a correctness bug, a security or privacy problem, a breaking change, data loss,
          missing error handling on a real failure path, or missing tests the instruction files require.

          Write your final message as the review, with no praise and no summary of the change:
          ### Code review
          Earlier findings: (re-reviews only) one line each: fixed | answered | open
          Blocking: numbered, each with path:line, the failure (inputs and wrong result) and the fix
          Non-blocking: numbered
          Checked and dismissed: a short list

          $VERDICT_RULE"
          else
            PROMPT="/code-review:code-review $REPO/pull/$PR_NUMBER

          When the review is complete, end your final message with a markdown
          outcome summary: a checklist of dimensions reviewed (correctness,
          security, tests, conventions), findings counted by severity, and a
          one-line verdict such as \"✅ no blocking issues\" or \"❌ N issues to fix\".

          $VERDICT_RULE"
          fi
          DELIMITER="PROMPT_$(openssl rand -hex 8)"
          { echo "text<<$DELIMITER"; printf '%s\n' "$PROMPT"; echo "$DELIMITER"; } >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      # continue-on-error so the outcome comment below always gets posted;
      # the last step re-fails the job if the review itself failed.
      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        # Pinned to a commit SHA (third-party actions are pinned); v1.0.248.
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ matrix.style == 'plugin' && 'https://github.com/anthropics/claude-code.git' || '' }}
          plugins: ${{ matrix.style == 'plugin' && 'code-review@claude-code-plugins' || '' }}
          claude_args: ${{ steps.prompt.outputs.args }}
          prompt: ${{ steps.prompt.outputs.text }}

      # Deterministic outcome comment: does not depend on Claude choosing to
      # comment. Extracts Claude's final message from the execution log and
      # posts it with the job status. Runs on success and failure.
      - name: Post outcome comment on PR
        id: outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # GITHUB_SHA on a pull_request event is the test merge commit, not the PR head.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Identifies this workflow's comment for this style, so other comments are never overwritten.
          # The plugin keeps the original marker, so existing outcome comments go on being updated.
          if [ "$REVIEW_STYLE" = "plugin" ]; then MARKER='<!-- claude-code-review-outcome -->'; else MARKER="<!-- claude-code-review-outcome:$REVIEW_STYLE -->"; fi
          BODY_FILE="$RUNNER_TEMP/outcome-comment.md"

          SUMMARY=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            # The action writes one JSON array of messages; -s plus the flatten
            # also accepts newline-delimited messages if that ever changes.
            SUMMARY=$(jq -rs '
              (if length == 1 and (.[0] | type) == "array" then .[0] else . end)
              | [.[] | select(.type == "assistant")] | last
              | .message.content // []
              | map(select(.type == "text") | .text)
              | join("\n\n")
            ' "$EXECUTION_FILE" 2>/dev/null || true)
          fi

          # The review text is posted publicly. Never post anything shaped like a credential
          # (GitHub and Anthropic tokens, auth headers); if one appears, the run approves nothing.
          LEAK=""
          if printf '%s' "$SUMMARY" | grep -qiE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{10,}|x-access-token|authorization: *(basic|bearer)'; then
            LEAK=true
            SUMMARY=$(printf '%s' "$SUMMARY" | sed -E 's/gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{10,}/[redacted]/g; s/(x-access-token|[Aa]uthorization: *([Bb]asic|[Bb]earer))[^[:space:]]*( *[^[:space:]]+)?/[redacted]/g')
          fi

          if [ "$REVIEW_OUTCOME" = "success" ]; then
            STATUS_LINE="✅ Review job completed."
          else
            STATUS_LINE="❌ Review job **failed**. See the [run log]($RUN_URL)."
          fi

          # The last VERDICT line decides the formal review. Anything else (no line,
          # an unexpected value, a failed run) means no approval: fail closed.
          # shellcheck disable=SC2016 # literal backticks in the pattern
          VERDICT=$(printf '%s\n' "$SUMMARY" | grep -oE '^`?VERDICT: (APPROVE|REQUEST_CHANGES)`?[[:space:]]*$' \
            | tail -n 1 | grep -oE 'APPROVE|REQUEST_CHANGES' || true)
          if [ "$REVIEW_OUTCOME" != "success" ] || [ -n "$LEAK" ]; then VERDICT=""; fi
          # A newer push gets its own review, so never approve or reject a commit that is no
          # longer the PR head. Checked here so the outcome comment can say so.
          HEAD_MOVED=""
          CURRENT_HEAD=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha || true)
          if [ -n "$VERDICT" ] && [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            HEAD_MOVED="${CURRENT_HEAD:-unknown}"
            VERDICT=""
          fi

          {
            echo "$MARKER"
            # Read by the next trace review to find what changed since this one.
            echo "<!-- reviewed-sha: $HEAD_SHA -->"
            if [ "$FORMAL" = "true" ]; then
              echo "## Claude Code Review: outcome"
            else
              echo "## Claude Code Review ($REVIEW_STYLE, trial): outcome"
              echo
              echo "_Trial run: this review is a comment only. It submits no formal review and never fails the checks._"
            fi
            echo
            echo "$STATUS_LINE"
            echo
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "_No summary was produced by the review run._"
            fi
            echo
            if [ "$FORMAL" != "true" ]; then
              echo "_Trial verdict: ${VERDICT:-none}. No formal review is submitted for a trial._"
            elif [ "$HEAD_MOVED" = "unknown" ]; then
              echo "_No formal review submitted: the PR's current head couldn't be confirmed, so nothing is approved._"
            elif [ -n "$HEAD_MOVED" ]; then
              echo "_No formal review submitted: the PR moved to ${HEAD_MOVED:0:7} during the review, which gets its own review._"
            elif [ -n "$LEAK" ]; then
              echo "_No formal review submitted: the review text contained something shaped like a credential (redacted above), so nothing is approved._"
            elif [ -z "$VERDICT" ]; then
              echo "_No formal review submitted: the run produced no verdict, so nothing is approved._"
            elif [ "$CLAUDE_REVIEW_APP_CONFIGURED" != "true" ]; then
              echo "_No formal review submitted: the Claude Review app isn't configured for this repository._"
            else
              # Replaced by the last step with what actually happened, so the comment never
              # shows a verdict that the formal review didn't carry out.
              echo "<!-- formal-review-status -->"
              echo "_Formal review: submitting **$VERDICT**…_"
            fi
            echo
            echo "---"
            echo "_Run: [$RUN_URL]($RUN_URL) · commit ${HEAD_SHA:0:7}_"
          } > "$BODY_FILE"

          # Update this workflow's previous outcome comment when there is one; otherwise create it.
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")))] | last | .id // empty" \
            | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@"$BODY_FILE" > /dev/null
          else
            COMMENT_ID=$(gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$BODY_FILE" --jq .id)
          fi
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

          # Published last, so a failure anywhere above leaves no verdict to act on.
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      # Mints a token for the Cell-Ed Claude Review app, scoped to this repository
      # and to pull requests only. Pinned to v3.2.0 (third-party actions are pinned
      # to a commit SHA).
      - name: Get a Claude Review app token
        id: app-token
        if: always() && env.FORMAL == 'true' && steps.outcome.outcome == 'success' && steps.outcome.outputs.verdict != '' && env.CLAUDE_REVIEW_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUDE_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # Submits Approve or Request changes as the app, on the commit that was reviewed.
      # An approval counts toward the branch rule's required approvals; with
      # "dismiss stale approvals" on, the next push clears it until the next review.
      - name: Submit the formal review
        id: submit
        if: always() && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERDICT: ${{ steps.outcome.outputs.verdict }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Never approve a commit that is no longer the PR head: a newer push gets its own review.
          CURRENT_HEAD=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "The PR head moved from $HEAD_SHA to $CURRENT_HEAD during the review; no formal review submitted."
            echo "result=moved" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$VERDICT" = "APPROVE" ]; then
            BODY="Claude Code Review: no blocking issues on ${HEAD_SHA:0:7}. Details in the outcome comment ([run]($RUN_URL))."
          else
            BODY="Claude Code Review found issues to fix before merging on ${HEAD_SHA:0:7}. See the outcome comment ([run]($RUN_URL))."
          fi
          gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f commit_id="$HEAD_SHA" -f event="$VERDICT" -f body="$BODY" > /dev/null
          echo "Submitted $VERDICT on ${HEAD_SHA:0:7}."
          echo "result=submitted" >> "$GITHUB_OUTPUT"

      # The outcome comment is posted before the formal review, so it said "submitting". Replace
      # that with what happened, including a failure, so it can't contradict the check.
      - name: Show the formal review result in the outcome comment
        if: always() && env.FORMAL == 'true' && steps.outcome.outputs.comment_id != '' && steps.outcome.outputs.verdict != '' && env.CLAUDE_REVIEW_APP_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ steps.outcome.outputs.comment_id }}
          VERDICT: ${{ steps.outcome.outputs.verdict }}
          TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
          SUBMIT_RESULT: ${{ steps.submit.outputs.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SUBMIT_RESULT" = "submitted" ] && [ "$VERDICT" = "APPROVE" ]; then
            LINE="✅ **Formal review: approved** by cell-ed-claude-review on ${HEAD_SHA:0:7}."
          elif [ "$SUBMIT_RESULT" = "submitted" ]; then
            LINE="❌ **Formal review: changes requested** by cell-ed-claude-review on ${HEAD_SHA:0:7}."
          elif [ "$SUBMIT_RESULT" = "moved" ]; then
            LINE="_No formal review submitted: the PR moved on during the review, and the newer commit gets its own review._"
          else
            LINE="⚠️ **Formal review failed** (app token: ${TOKEN_OUTCOME:-not run}, submit: ${SUBMIT_OUTCOME:-not run}), so nothing was approved. See the [run log]($RUN_URL)."
          fi
          BODY_FILE="$RUNNER_TEMP/outcome-comment-final.md"
          gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body \
            | awk -v line="$LINE" 'replace { print line; replace = 0; next } /^<!-- formal-review-status -->$/ { replace = 1 } { print }' \
            > "$BODY_FILE"
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@"$BODY_FILE" > /dev/null

      - name: Fail the job if the review failed
        if: steps.claude-review.outcome == 'failure'
        run: exit 1
